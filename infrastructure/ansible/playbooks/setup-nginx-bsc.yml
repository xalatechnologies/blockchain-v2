---
# Setup NGINX with SSL for BSC RPC endpoint
# Configures reverse proxy with rate limiting and SSL

- name: Setup NGINX with SSL for BSC RPC
  hosts: bsc_validators
  become: yes
  vars:
    domain_name: "rpc.bitcoinbr.tech"
    email_address: "admin@bitcoinbr.tech"
    rpc_port: 8545
    ws_port: 8546
  
  tasks:
    - name: Install NGINX
      yum:
        name: nginx
        state: present

    - name: Install Certbot
      yum:
        name:
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Stop NGINX for certificate generation
      systemd:
        name: nginx
        state: stopped

    - name: Obtain SSL certificate
      command: >
        certbot certonly --standalone
        --non-interactive
        --agree-tos
        --email {{ email_address }}
        -d {{ domain_name }}
      args:
        creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem

    - name: Create NGINX configuration for BSC RPC
      copy:
        content: |
          # Rate limiting zones
          limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=100r/s;
          limit_req_zone $binary_remote_addr zone=ws_limit:10m rate=50r/s;

          # Upstream for RPC (HTTP) - Only validator-1 has RPC enabled
          upstream bsc_rpc {
              server 127.0.0.1:{{ rpc_port }} max_fails=3 fail_timeout=30s;
              keepalive 96;
          }

          # Upstream for WebSocket
          upstream bsc_ws {
              server 127.0.0.1:{{ ws_port }} max_fails=3 fail_timeout=30s;
              keepalive 48;
          }

          # HTTP server (redirect to HTTPS)
          server {
              listen 80;
              server_name {{ domain_name }};
              
              location / {
                  return 301 https://$server_name$request_uri;
              }
          }

          # HTTPS server with SSL
          server {
              listen 443 ssl;
              http2 on;
              server_name {{ domain_name }};
              
              # SSL certificate
              ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
              
              # SSL configuration
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
              ssl_prefer_server_ciphers off;
              
              # Security headers
              add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
              add_header X-Frame-Options "SAMEORIGIN" always;
              add_header X-Content-Type-Options "nosniff" always;
              
              # Health check
              location /health {
                  access_log off;
                  return 200 "OK\n";
                  add_header Content-Type text/plain;
              }
              
              # RPC endpoint
              location / {
                  limit_req zone=rpc_limit burst=200 nodelay;
                  
                  proxy_pass http://bsc_rpc;
                  proxy_http_version 1.1;
                  proxy_set_header Host $http_host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  
                  # CORS headers
                  add_header 'Access-Control-Allow-Origin' '*' always;
                  add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                  add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
                  
                  if ($request_method = 'OPTIONS') {
                      return 204;
                  }
              }
              
              # WebSocket endpoint
              location /ws {
                  limit_req zone=ws_limit burst=100 nodelay;
                  
                  proxy_pass http://bsc_ws;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host $http_host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  
                  add_header 'Access-Control-Allow-Origin' '*' always;
              }
          }
        dest: /etc/nginx/conf.d/bsc-rpc.conf
        owner: root
        group: root
        mode: '0644'

    - name: Test NGINX configuration
      command: nginx -t

    - name: Start and enable NGINX
      systemd:
        name: nginx
        state: started
        enabled: yes

    - name: Setup automatic certificate renewal
      cron:
        name: "Renew Let's Encrypt certificates"
        minute: "0"
        hour: "0,12"
        job: "certbot renew --quiet --post-hook 'systemctl reload nginx'"

    - name: Display completion message
      debug:
        msg:
          - "========================================="
          - "✅ NGINX SSL Setup Complete!"
          - "========================================="
          - ""
          - "HTTPS RPC: https://{{ domain_name }}"
          - "WebSocket: wss://{{ domain_name }}/ws"
          - ""
          - "SSL auto-renews every 12 hours"
          - "========================================="
